name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: mister-cover-scraper.exe
            asset_name: mister-cover-scraper-windows-x86_64.exe
          - os: ubuntu-latest
            artifact_name: mister-cover-scraper
            asset_name: mister-cover-scraper-linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
            librsvg2-dev librsvg2-bin libgirepository1.0-dev gobject-introspection \
            libglib2.0-dev libglib2.0-bin libgdk-pixbuf2.0-bin \
            patchelf desktop-file-utils file squashfs-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage binary artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-appimage.sh

      - name: Stage AppImage artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp mister-cover-scraper-linux-x86_64.AppImage dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mister-cover-scraper-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
